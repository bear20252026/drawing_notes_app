name: Code Guard (行数门禁)

# 独立代码质量门禁（与主 CI 解耦，可单独触发）：
# - linecheck：轻量双档（500 行警告 / 1000 行错误），官方 Rust 工具
# - sloc-guard：SLOC+目录结构门禁，--diff 模式只查本次变更文件
#   （既有超限文件祖父化放行，新增/变更超限即拦截——灵活不降级）
# - 回退：若 Rust 工具链不可用，调用 tools/code_guard.py 内置检查

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# CI/CD 加固（Skylos SKY-D291——2026-08-16）：最小权限。
permissions: {}


# 快速连推/重开 PR 时取消同组在跑的旧 run，节省排队时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  line-count-gates:
    name: Line Count Gates (500 warn / 1000 error)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # --diff 需要完整历史

      - name: Setup Rust toolchain
        # SHA pin 后 ref 名不再是 stable，须显式声明 toolchain（否则按调用方 ref 误推）
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # P3-7（审计 2026-10-05）：门禁工具钉版——未锁版即规则漂移（W3 同款
      # 教训）。升级流程：本地评估新版 → 改版本号 → 单独提交写明动机。
      - name: Install linecheck (钉版 1.2.1)
        run: cargo install linecheck --locked --version 1.2.1

      - name: Install sloc-guard (钉版 0.6.0)
        run: cargo install sloc-guard --locked --version 0.6.0

      - name: linecheck 双档门禁
        # 警告非阻断（退出码 0，由工具语义保证），错误阻断（退出码 1）。
        # P1 修复（审计）：删除 `continue-on-error` + `|| true` 双重放行，
        # 恢复 1000 行硬上限阻断（2026-09-04：门禁恢复首跑即报出
        # note_block_doc_store 1021 行超限——门禁有效；该已知 God 类按
        # 祖父化哲学在 linecheck.yml exclude 单独放行并挂拆分排期，
        # 其余文件硬阻断；warn 档仍只报告不拦）。
        run: linecheck --config linecheck.yml lib/

      - name: sloc-guard 变更文件门禁（灵活祖父化）
        # 只检查 PR 变更的文件；既有超限文件不在此列，不阻断。
        # P1 修复（审计）：GitHub 上下文经 env 传递，不直接插值进 run
        #（脚本注入面——base.sha 为 hex 低风险，但统一收口）。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"
          else
            BASE="origin/master"
          fi
          sloc-guard check --config .sloc-guard.toml --diff "$BASE..HEAD" || exit $?

      - name: 内置回退检查（Python，语言无关）
        # 若 Rust 工具未装/失败，仍能通过内置检查发现超限文件（报告级别）。
        continue-on-error: true
        run: |
          python3 tools/code_guard.py --dir lib --json || true

  skylos-dart-gates:
    name: Skylos Dart Dead-Code/Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DN-102 修复（专家审计 2026-10-12）：原为 **job 级** `continue-on-error: true`
    #（2026-08-31 引入，理由「Skylos 对 Flutter widget 框架误报率近 100%」）。
    # 但 job 级容错会让 job 报 failure、而 workflow 报 success ⇒ 与
    # docs/CODE_REVIEW_POLICY.md 第一节「安全 definite 问题 → 禁止合并」
    # 直接矛盾。实测证据：连续 3 个提交（58a5e62 / 249392f / 0d20acb）均为
    # workflow=success + job=failure —— 安全门禁在失败，面板却是绿的。
    #
    # 修法是**拆域**而非简单翻转（直接翻转会把 --danger 的误报一起变成阻断）：
    # - 安全域 `--gate --secrets` 恢复阻断：信噪比高（已知 2 处高熵误报已按
    #   项目既有 exclude 机制基线化），且正是规范所指的「安全 definite」。
    # - 死代码域 `--danger` 只归档报告：它在 part 化 Dart 库上误报率近 100%
    #   （实测单个 editor_page.dart 即产出 80 unused-import + 54
    #   unused-variable + 2 unused-function），全量阻断会让门禁失去可信度。
    # 拆分不减少当前阻断面：原合并命令（--gate --secrets --danger）退出码为 0，
    # 即 --danger 当前未贡献任何阻断项。

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # --diff / PR 评审需要完整历史

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Skylos (官方最新版)
        # P3-7：钉版（原「官方最新版」）。
        run: pip install skylos==4.33.2

      - name: Skylos 安全域门禁（secrets，阻断）
        # DN-102：正式裁决域。--gate 下安全 definite 问题即失败，对应
        # docs/CODE_REVIEW_POLICY.md 第一节硬性红线（不得再被容错吞掉）。
        # 默认 30 秒在完整历史检出的大仓库中会提前终止 grep 复核，
        # 因此显式放宽至 120 秒，仍受 job 的 15 分钟总超时保护。
        #
        # 验收证据（突变自证：临时分支 + workflow_dispatch，验毕已删分支）：
        # 把 pyproject.toml 的 exclude 路径改回失效态（即复现旧版本的失败
        # 条件）后，同一份代码上三种参数组合的退出码为
        #     --gate --secrets          → 1（拦住）
        #     --gate --danger           → 0
        #     --gate --secrets --danger → 1
        # ⇒ 本步骤的阻断面与旧的合并命令**完全一致**（历史失败全部来自
        #   secrets 域的高熵 ##[error]），--danger 从未贡献过任何阻断项，
        #   因此把它移到非阻断是零损失。同时 job 结论由 success 变 failure
        #   —— 门禁真的会拦，不再是装饰。证据 run 38263627843
        #   （workflow=failure，阻断步骤正是本步骤）。
        # 教训：随机 66 字符 base62 串**不会**被判为高熵（实测 exit 0），
        # 故自证必须复现真实触发条件，不能用「看起来像密钥」的假串。
        env:
          SKYLOS_GREP_BUDGET: "120"
        run: |
          skylos . --gate --secrets --sarif skylos-secrets.sarif --format github

      - name: Skylos 死代码域扫描（danger，仅报告）
        # DN-102：本域**不加 --gate**（不参与门禁裁决）；命中数另写入 job
        # summary，保证「不阻断」不等于「不可见」。continue-on-error 为保险：
        # 本域退出码在任何情况下都不得影响 job 结论。
        if: always()
        continue-on-error: true
        env:
          SKYLOS_GREP_BUDGET: "120"
        run: |
          skylos . --danger --sarif skylos-danger.sarif --format github

      - name: 死代码域命中数写入 job summary（可见但不阻断）
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, os
          n = 0
          try:
              with open('skylos-danger.sarif', encoding='utf-8') as fh:
                  n = len(json.load(fh).get('runs', [{}])[0].get('results', []))
          except Exception:
              pass
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('### Skylos 死代码域（仅报告，不阻断）\n\n')
              fh.write(f'本次命中 {n} 条。该域在 part 化 Dart 库上误报率近 100%，'
                       '故只归档不阻断；逐条证据见 artifact `skylos-sarif`。\n')
          PYEOF

      - name: 归档 Skylos SARIF（审计留痕）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skylos-sarif
          path: skylos-*.sarif
          if-no-files-found: ignore

  open-code-review:
    name: Open Code Review (行级评审，领导已批准)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 涉密红线已由领导批准解除：允许在评审流程中使用 LLM 端点。
    # 端点经 GitHub Secrets 注入（OCR_LOCAL_ENDPOINT / OCR_LOCAL_MODEL /
    # OCR_API_KEY）；配置后即执行真实行级评审并正式生效（无 || true）。
    env:
      OCR_PROVIDER: my-gateway
      OCR_LOCAL_ENDPOINT: ${{ secrets.OCR_LOCAL_ENDPOINT }}
      OCR_LOCAL_MODEL: ${{ secrets.OCR_LOCAL_MODEL }}
      OCR_API_KEY: ${{ secrets.OCR_API_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Open Code Review (官方 npm 包)
        # P3-7：钉版（原「官方最新版」）。
        run: npm install --ignore-scripts -g @alibaba-group/open-code-review@1.12.13

      - name: 涉密预检（评审前红线检查）
        # 白名单外目录或涉密内容（密钥/口令）一律拦截，禁止提交给 OCR。
        # 依据 docs/OCR_REVIEW_POLICY.md 第三节。
        #
        # ⚠ 审计 TE-TST-05 / CTL-02（2026-10-16）：原实现固定用
        # `git diff origin/master...HEAD`，而**直推 master 的工作流里 HEAD 就是刚被推上去的
        # origin/master** ⇒ 三点 diff 产出 0 个文件，白名单检查与涉密检查都在**空输入**上跑，
        # 末尾照样打印「涉密预检通过」。实测（本仓最近一次推送）：
        # `git diff origin/master...HEAD --name-only | wc -l` = **0**。
        # 「没有违规」与「什么都没看」在这里是同一个输出——这是本仓「空集即通过」那一族里
        # 唯一一条**安全类**门禁，所以优先修。
        #
        # 修法两件事：① 按事件类型选基线（push 用本次推送进来的那一段，PR 保持 origin/master）；
        # ② 基线算出空变更集就判失败，不再判通过。
        # 误拦风险已实测回看：以父提交为基线，最近 12 次推送的凭据赋值命中数全部为 0
        # （变更文件数 1~17，均非空）⇒ 换基线之后这条检查才开始真跑，且不会回头拦历史。
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            BASE="origin/master"
          else
            BEFORE='${{ github.event.before }}'
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ] \
               && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
              BASE="$BEFORE"
            else
              # 首推分支 / force push 改写历史：退回上一个提交。
              # 这比原来扫 0 个文件好，但**多提交推送时只覆盖最后一笔**——
              # 深扫描由 Secret Scan（Gitleaks 全量）兜底，本步只是评审前的粗筛。
              BASE="HEAD~1"
            fi
          fi
          echo "diff 基线：$BASE（事件：${GITHUB_EVENT_NAME:-unknown}）"
          CHANGED=$(git diff "$BASE...HEAD" --name-only 2>/dev/null || true)
          # 空变更集 == 门禁失明。此时下面两句「0 个白名单外、0 个涉密命中」
          # 与真的合规完全同形，必须判失败（审计 TE-TST-05）。
          if [ -z "$CHANGED" ]; then
            echo "::error::涉密预检失明：以 $BASE 为基线算不出任何变更文件——" \
                 "基线选错/浅克隆/事件假设变了都会走到这里，绝不能当成「检查通过」。"
            exit 1
          fi
          echo "本次变更文件:"
          echo "$CHANGED"
          # 1) 白名单检查：只允许 lib/test/tools/.github/workflows
          OUTSIDE=$(echo "$CHANGED" | grep -vE "^(lib/|test/|tools/|\.github/workflows/)" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "⚠ 白名单外文件（跳过评审，不阻断）:"
            echo "$OUTSIDE"
            echo "out_of_scope=true" >> "$GITHUB_ENV"
          fi
          # 2) 涉密内容检查（P3-6 收敛，审计 2026-10-05）：原实现「文件名含
          # 关键词 ⇒ 全量 diff（含上下文行）关键词裸匹配」——Dart 标识符几乎
          # 必命中，正常提交被误拦，消耗门禁可信度。现只扫**新增行**，且只
          # 匹配「凭据赋值」真泄密形态（关键字后接赋值符+≥12 字符字面量，
          # 阈值避开测试短夹具）；深扫描仍由 Secret Scan（Gitleaks）兜底。
          ADDED=$(git diff "$BASE...HEAD" --unified=0 | grep -E "^\+[^+]" || true)
          HIT=$(echo "$ADDED" | grep -iE "(api[_-]?key|secret|password|token|口令|密钥)[\"']?[[:space:]]*[:=][[:space:]]*[\"'][^\"']{12,}" || true)
          if [ -n "$HIT" ]; then
            echo "::error::新增行命中凭据赋值形态，疑似涉密，禁止评审！"
            echo "$HIT" | head -5
            exit 1
          fi
          echo "涉密预检通过（扫了 $(echo "$CHANGED" | wc -l) 个文件、$(echo "$ADDED" | grep -c . || true) 行新增）"

      - name: 配置模型端点（Secrets 注入；领导批准后正式生效）
        run: |
          if [ -n "$OCR_LOCAL_ENDPOINT" ]; then
            ocr config set provider "$OCR_PROVIDER"
            ocr config set custom_providers.my-gateway.url "$OCR_LOCAL_ENDPOINT"
            ocr config set custom_providers.my-gateway.model "$OCR_LOCAL_MODEL"
            if [ -n "$OCR_API_KEY" ]; then
              ocr config set custom_providers.my-gateway.api_key "$OCR_API_KEY"
            fi
            echo "模型端点已配置（领导批准，正式评审）"
          else
            echo "尚未配置 OCR_LOCAL_ENDPOINT——领导已批准，请配置后激活真实评审"
            echo "endpoint_configured=false" >> "$GITHUB_ENV"
          fi

      - name: 行级评审（diff 模式，正式门禁）
        # 领导批准上传：配置端点后执行真实评审，发现问题即失败（无 || true）。
        if: env.endpoint_configured != 'false'
        run: ocr review --base origin/master --head HEAD --format markdown

      - name: 委派模式评审（端点未配置时的离线兜底）
        if: env.endpoint_configured == 'false'
        run: |
          echo "建议在本地开发时使用委派模式："
          echo "  ocr delegate preview"
          echo "  ocr delegate rule lib/main.dart"

  python-tools-gates:
    name: Python Tools Gates (py-cq + pyscn)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 pyscn 等（P3-7 钉版 pyscn；辅助工具不锁）
        run: |
          pip install git+https://github.com/rhiza-fr/py-cq.git
          pip install pyscn==1.29.0 ruff ty bandit vulture radon interrogate

      - name: py-cq 聚合门禁（tools/ Python 辅助脚本）
        # 聚合 11 工具评分；先报告不阻断（continue-on-error）
        continue-on-error: true
        run: |
          cd tools && cq check . -o score || true

      - name: pyscn 架构分析（tools/，A-F 评分）
        # 循环依赖/复杂度/死代码门禁；报告模式先观测
        continue-on-error: true
        run: |
          pyscn analyze tools --skip-clones --skip-communities --skip-lcom --json || true

  repopilot-gate:
    name: RepoPilot Diff Evidence Gate (零上传)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # --base 需要完整历史

      - name: Install RepoPilot (官方预编译二进制)
        # 本地优先 Rust CLI；零上传、无 LLM 调用——契合政府涉密红线。
        run: |
          curl -sL -o /tmp/repopilot.tar.gz \
            "https://github.com/MykytaStel/repopilot/releases/download/v0.21.0/repopilot-v0.21.0-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/repopilot.tar.gz -C /usr/local/bin
          repopilot --version

      - name: RepoPilot git diff 证据门禁（正式）
        # 收紧为正式门禁：--fail-on-review definitely 只拦新增 definite 级
        # 问题（evidence 驱动）；历史存量问题不阻塞（diff 对比天然只算新增）。
        # P1 修复（审计）：同上，上下文经 env 传递。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"
          else
            BASE="HEAD~1"
          fi
          # --fail-on-review none：review-signal gate 不阻断（definitely-
          # sensitive 信号（workflow/pyproject 变更）需人工确认——CI 自动
          # 跑无法确认——findings 门禁（--fail-on 轴）保留——官方
          # [review] fail_on 支持 none/definitely。
          repopilot review . --base "$BASE" --fail-on-review none

  desloppify-gate:
    name: Desloppify Dart Health Gate (OSNL-0.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desloppify (P3-7 钉版 1.0)
        # 支持 29 语言含 Dart（full plugin depth）；机械检测 + LLM 主观审查。
        # 许可 OSNL-0.2（非 MIT/Apache）——接入前需法务确认，先观测。
        run: pip install desloppify==1.0

      - name: Desloppify Dart 健康扫描（CI profile，正式门禁）
        # 领导批准，转正式门禁：objective（机械检测）评分 < 60 即阻断。
        # subjective（LLM 审查）默认 0 不计入，避免涉密上传。
        run: |
          desloppify --exclude ".dart_tool,build" scan --profile ci
          SCORE=$(desloppify status --json | python3 -c \
            "import sys,json; print(round(json.load(sys.stdin)['objective_score'],1))")
          echo "objective_score=$SCORE"
          python3 - <<PYEOF
          import subprocess, json
          score = float(subprocess.check_output(
              ['desloppify','status','--json'], text=True)
              .strip().split('objective_score')[1].split(',')[0]
              if False else $SCORE)
          if score < 60:
              raise SystemExit(f"desloppify objective_score {score} < 60 门禁阻断")
          PYEOF

      - name: Desloppify 状态面板（审计留痕）
        if: always()
        continue-on-error: true
        run: |
          desloppify status || true

