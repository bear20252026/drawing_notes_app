name: Secret Scan（秘密扫描门禁）

# 发布材料门禁（专家审计最优先④，2026-08-16）：
# - gitleaks-action@v3（官方 SAST——Node 24——2026-06 GitHub 默认 Node 24；
#   个人账号无需 GITLEAKS_LICENSE——检测硬编码密钥/API Key/令牌）
# - 本地 scan_secrets.py 兜底（Gitleaks 模式——引号内高熵检测）
# 掘金生产级 CI/CD 多重门控模式：安全检查与主 CI 并行——快速失败省钱。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks（官方 SAST）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  local-scan:
    name: 本地秘密扫描（scan_secrets.py）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 运行本地秘密扫描（Gitleaks 模式）
        run: python tools/scan_secrets.py
