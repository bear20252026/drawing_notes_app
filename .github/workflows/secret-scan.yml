name: Secret Scan（秘密扫描门禁）

# 发布材料门禁（专家计最优先①，2026-08-16）：
# - gitleaks-action@v3（官方 SAST——Node 24——2026-06 GitHub 默认 Node 24）：
#   个人账号无需 GITLEAKS_LICENSE——检测硬编码密钥/API Key/令牌。
# - 本地 scan_secrets.py 兜底（Gitleaks 模式——引擎内高熵检测）。
# - dart-password-gate（安全加固 P0，2026-08-25）：lib/ 生产代码硬编码
#   测试密码赋值零容忍门禁——测试密码必须走 .env/环境变量或测试夹具。
# 掘金生产级 CI/CD 多重门控模式：安全检查与主 CI 并行——快速失败省钱。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks（官方 SAST）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  local-scan:
    name: 本地秘密扫描（scan_secrets.py）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 运行本地秘密扫描（Gitleaks 模式）
        run: python tools/scan_secrets.py

  # 安全加固 P0（2026-08-25）：lib/ 硬编码密码赋值零容忍。
  # 检测模式：password 变量的字符串字面量赋值（排除 UI 控件/命名参数/
  # obscureText 等 UI 惯用法）。命中即失败——修复方式：
  #   1) 测试密码 → 移入 test/ 夹具（本规则不扫 test/）
  #   2) 运行时凭据 → --dart-define / 环境变量 / .env（.gitignore 已排除）
  dart-password-gate:
    name: lib/ 硬编码密码门禁（Dart 赋值零容忍）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 扫描 lib/ 与 packages/*/lib 的硬编码密码赋值
        run: |
          set -euo pipefail
          echo "== 扫描范围：lib/ packages/*/lib（生产代码，不含 test/）=="
          # 领导指定的 grep 模式：password 变量的字符串字面量赋值。
          # 大小写：camelCase/PascalCase 标识符均检测（adminPassword 等）。
          # 排除：构造参数传递(password:)、控制器、obscureText 等 UI 惯用法、
          # 路由名常量（必须含连字符或前导斜杠——纯小写词可能是真密码）。
          HITS=$(grep -rnE "[Pp]assword[A-Za-z0-9_]*\s*=\s*['\"][^'\"]+['\"]" \
            lib packages/*/lib \
            --include='*.dart' \
            | grep -v "this\.password" \
            | grep -v "passwordController" \
            | grep -v "obscureText" \
            | grep -vE "password:\s*['\"]" \
            | grep -vE "=\s*['\"](/?[a-z][a-z0-9]*(-[a-z0-9]+)+|/[a-z][a-z0-9/-]*)['\"]" \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::发现 lib/ 生产代码硬编码密码赋值——禁止提交！"
            echo "$HITS"
            exit 1
          fi
          echo "✅ lib/ 无硬编码密码赋值"
