name: Secret Scan（秘密扫描门禁）

# 发布材料门禁（专家审计最优先④，2026-08-16）：
# - gitleaks-action@v3（官方 SAST——Node 24——2026-06 GitHub 默认 Node 24；
#   个人账号无需 GITLEAKS_LICENSE——检测硬编码密钥/API Key/令牌）
# - 本地 scan_secrets.py 兜底（Gitleaks 模式——引号内高熵检测）
# 掘金生产级 CI/CD 多重门控模式：安全检查与主 CI 并行——快速失败省钱。
#
# ⚠ 2026-11 审计（与 pr-security.yml 的分工）：本文件与 pr-security.yml 都跑
# `python tools/scan_secrets.py`，这是**有意的两侧覆盖**：
#   · 本文件 = **push 侧**（push master + PR + dispatch）。存在的理由是
#     pr-* 那三条只在 pull_request 触发，而本仓走直推 master ⇒ 直推流程
#     需要一条独立的全量秘密扫描（含官方 gitleaks-action）。
#   · pr-security.yml = **PR 侧**，把秘密扫描与 SBOM/依赖检查打包成一条
#     required workflow，合并前拦住引入的密钥。
# 同一脚本、不同触发面与证据归属，不合并（合并会让直推流程失去独立证据）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read


# 快速连推/重开 PR 时取消同组在跑的旧 run，节省排队时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks（官方 SAST）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  local-scan:
    name: 本地秘密扫描（scan_secrets.py）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 运行本地秘密扫描（Gitleaks 模式）
        run: python tools/scan_secrets.py
