name: 软件质量工程门禁

# 商业化质量保障：提交 / PR 自动跑全部门禁，任一失败即红灯。
# 本地等价命令：python tools/quality_gate.py
on:
  push:
    branches: [master, main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/**'
      - '.github/workflows/quality_gate.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# P1 修复（审计）：最小权限——checkout 需 contents:read，
# 失败产物上传需 actions:write；其余一律不授。
permissions:
  contents: read
  actions: write

jobs:
  quality:
    name: Quality Gate（分析/反模式/架构/回归）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 与本机工具链对齐（dart_code_metrics 5.7.6 需匹配 Dart 版本）
      - name: 安装 Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: 依赖
        run: flutter pub get

      # 版本一致性门禁（2026-09-06 审计）：pubspec 为唯一版本源，
      # 校验安装器脚本（含 VersionInfoVersion 历史残留）与 CHANGELOG 同步。
      - name: 版本一致性校验
        run: dart run tools/check_version_consistency.dart

      # 反模式扫描门禁依赖 dart_code_metrics（全局激活，使 `metrics` 可用）。
      # 锁定 5.7.6 与 ci.yml / 本机工具链一致（未锁定时 CI 拉到新版本，
      # 规则行为漂移导致门禁结果不可复现——W3 修正 2026-09-02）。
      - name: 安装 dart_code_metrics（反模式扫描）
        id: dcm_install
        # E-02 降级（批次 AT，用户拍板「继续钉版 + 激活失败降级」）：上游已停维护并归档转
        # 闭源 DCM，唯一新增残余风险是「包被下架 ⇒ 激活失败 ⇒ 本门禁把 job 打死」。
        # 那是工具供应链故障、不是代码质量问题 ⇒ 降级为可见告警（warning + Step Summary），
        # 门禁在工具可用时照常拦截。精确钉版 5.7.6 不变（未锁定时曾出现规则行为漂移，
        # W3 修正 2026-09-02）。
        run: |
          if dart pub global activate dart_code_metrics 5.7.6; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E-02：dart_code_metrics 5.7.6 激活失败（上游下架或网络故障），本次反模式扫描门禁未执行——需人工处置，见本步注释。"
            echo "## E-02 告警：反模式扫描门禁被跳过（非代码问题）" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "激活 dart_code_metrics 5.7.6 失败，本次 metrics analyze lib **未执行**。" >> "$GITHUB_STEP_SUMMARY"
            echo "CI 故意不因此变红；这是上游停维护带来的工具供应链告警，处置口径见本步注释。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 静态分析（analyze）
        run: flutter analyze --no-pub

      - name: 反模式扫描门禁（metrics analyze lib）
        if: steps.dcm_install.outputs.available == 'true'
        run: metrics analyze lib

      - name: 分层架构门禁（architecture_test）
        run: flutter test --no-pub test/architecture_test.dart

      - name: 回归测试（全量：drawing + notes + 各 feature + 架构）
        run: flutter test --no-pub

      # 本代码库尚未统一 dart format 规范（会改动 53 个 lib 文件），故此处仅作 informational，
      # 不阻塞门禁；待 M5 落地后可单独建立完整 format baseline 再收紧为 blocking。
      - name: 格式化提示（dart format，仅 lib，非阻断）
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib

      # 代码规模统计（informational，不阻断门禁）：每次 CI 运行都输出
      # lib/test 的 .dart 文件数与总行数，并写入 GitHub Step Summary。
      - name: 代码行数统计（informational）
        run: |
          lib_files=$(find lib -name '*.dart' | wc -l)
          lib_lines=$(find lib -name '*.dart' -exec cat {} + | wc -l)
          test_files=$(find test -name '*.dart' | wc -l)
          test_lines=$(find test -name '*.dart' -exec cat {} + | wc -l)
          total_files=$((lib_files + test_files))
          total_lines=$((lib_lines + test_lines))
          {
            echo "## 代码行数统计（.dart）"
            echo ""
            echo "| 范围 | 文件数 | 行数 |"
            echo "|---|---|---|"
            echo "| lib/ 源代码 | ${lib_files} | ${lib_lines} |"
            echo "| test/ 测试 | ${test_files} | ${test_lines} |"
            echo "| **总计** | **${total_files}** | **${total_lines}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "lib/  源代码：${lib_files} 个文件，${lib_lines} 行"
          echo "test/ 测试：${test_files} 个文件，${test_lines} 行"
          echo "总计：${total_files} 个文件，${total_lines} 行"

      - name: 上传失败产物（测试报告/日志）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-gate-logs
          path: |
            **/*.json
            **/reports/**/*.html
          if-no-files-found: ignore
