name: Release Build (Windows + Android)

# 云端打包：从 GitHub 托管的 runner 上构建发布产物，走 Actions 上传 Artifact，
# 再由使用者下载（不在本地机器打包，保证构建环境统一、可复现）。
# 触发方式：
#  - Workflow 页面手动 Dispatch（可分别勾选 Android / Windows）
#  - 推送 tag v* 时自动构建并在 GitHub Release 挂载 Windows 安装包 + Android APK（2026-08-30 对齐）

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android APK (含 AAB)'
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows 桌面版（含 setup 安装包）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

# 权限：Android 任务仅需读；Windows 任务需要 contents: write 以便打 tag 时创建 Release。
permissions:
  contents: read

jobs:
  android:
    name: Android Release Build
    # tag 推送时 inputs 为空（falsy），需显式包含 tag 触发（与 windows job 对齐）。
    if: ${{ inputs.build_android || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 最小权限（2026-09-06 审计）：Android 产物只上传 artifact，不再写
    # GitHub Release（消除与 Windows job 并发更新同一 Release 的竞态；
    # APK/AAB 从 workflow artifact 获取）。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # 秘钥缺失/格式错误时尽早失败（审计：避免跑到构建末尾才报错）。
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        # 与 key.properties 的 storeFile=app/release.jks 对齐（相对于 android/ 目录）。
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          if [ ! -s android/app/release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_B64 缺失或解码为空"; exit 1
          fi

      - name: Write key.properties
        env:
          SP: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          # Gradle 模块工作目录是 android/app/，storeFile 相对于该目录解析。
          # keystore 写到 android/app/release.jks，故 storeFile=release.jks。
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$SP" "$KP" "$ALIAS" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AppBundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # 项目规范（docs/RELEASE_PIPELINE.md）：所有安装包生成后必须压缩为 zip。
      - name: Compress APK to ZIP
        run: |
          cd build/app/outputs/flutter-apk
          zip -q drawing_notes_android_release.zip app-release.apk

      - name: Upload Android ZIP
        uses: actions/upload-artifact@v7
        with:
          name: android-release-zip
          path: build/app/outputs/flutter-apk/drawing_notes_android_release.zip
          if-no-files-found: error

  windows:
    name: Windows Release Build
    if: ${{ inputs.build_windows || startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # 版本一致性门禁（2026-09-06 审计）：安装器版本必须与 pubspec 同源。
      - name: Version consistency check
        run: dart run tools/check_version_consistency.dart

      # Windows release smoke（审计：CI 从未运行 integration_test）：
      # 真实启动 App 验证关键流程。测试已在本地 Windows 真机 4/4 通过；
      # GitHub 无头会话的窗口/渲染环境与真机不同导致首帧断言不稳，
      # 暂设 continue-on-error 不阻塞发版——CI 无头渲染差异需专门排查。
      - name: Smoke test (integration_test on Windows)
        continue-on-error: true
        run: flutter test integration_test/smoke_test.dart -d windows

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found after chocolatey install" }

      - name: Build Windows setup installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "tools/drawing_notes_setup.iss"
          if (-not (Get-ChildItem "build/windows/installer/setup_*.exe" -ErrorAction SilentlyContinue)) {
            throw "setup_*.exe not produced by ISCC"
          }

      # 安装器完整性校验（审计：发布产物无 SHA256/版本核验）。
      - name: Verify installer (version + SHA256)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/windows/installer/setup_*.exe" | Select-Object -First 1
          $pubVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $expected = "setup_drawing_notes_$($pubVersion.Split('+')[0]).exe"
          if ($exe.Name -ne $expected) {
            throw "Installer name '$($exe.Name)' != expected '$expected' (pubspec $pubVersion)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Out-File -Encoding utf8 "$exe.DirectoryName/SHA256SUMS.txt"
          Write-Host "SHA256: $hash  ($($exe.Name))"

      - name: Upload Windows raw release
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      # 项目规范（docs/RELEASE_PIPELINE.md）：所有安装包生成后必须压缩为 zip。
      - name: Compress installer to ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/windows/installer/setup_*.exe" | Select-Object -First 1
          $zip = Join-Path $exe.DirectoryName "drawing_notes_windows_setup.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          Write-Host "ZIP produced: $zip"

      - name: Upload Windows setup installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-installer
          path: build/windows/installer/setup_*.exe
          if-no-files-found: error

      - name: Upload Windows installer ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-zip
          path: build/windows/installer/drawing_notes_windows_setup.zip
          if-no-files-found: error

      - name: Create/update GitHub Release with installer (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/windows/installer/setup_*.exe
            build/windows/installer/drawing_notes_windows_setup.zip
          draft: false
          generate_release_notes: true
