# PR 安全门（专家 I-005——2026-08-16——批次 A required_workflows）。
# 安全契约：秘密扫描（Gitleaks 模式）+ SBOM 生成 + 依赖过期检查。
#
# ⚠ 2026-11 审计（与 secret-scan.yml 的分工）：本文件与 secret-scan.yml 都有
# `python tools/scan_secrets.py`（job 名也不同：`security` vs `local-scan`），
# 这是**有意的两侧覆盖**，不是重复建设：
#   · pr-security.yml —— **PR 侧**。目标是在合并前拦住引入的密钥，且同一条
#     job 里连带 SBOM + 依赖检查（一条 required workflow 拿到全套依赖面证据）。
#   · secret-scan.yml —— **push 侧**（push master + PR + dispatch）。目标是
#     直推 master 之后也有全量秘密扫描（官方 gitleaks-action + 本地兼底），
#     因为 pr-* 那三条**只在 pull_request 触发**，直推流程从不执行。
# 两者扫描的是同一份代码、跑的是同一个脚本，但**触发面与证据归属不同**。
# 若要合并：不要删本文件的步骤，而是让 secret-scan.yml 的 push 侧去调
# pr-security 的产出——但那样直推流程就没有独立证据了，故保持现状。
# ⚠ 名称口径：`check_deps.sh` 只输出依赖概览 + `dart pub outdated`，**没有
# 真实 CVE 数据源与失败阈值**，不得称 CVE 扫描（见下方 C-004/C-005 更正）。
name: PR Security
on:
  pull_request:
    branches: [master]
permissions:
  contents: read

# 快速连推/重开 PR 时取消同组在跑的旧 run，节省排队时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Secret Scan + SBOM + Deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # CI 缺陷修复（2026-11-14，PR #56 首次走 PR 流程暴露）：check_deps.sh
      # 需要 dart pub outdated，而本 job 此前只装了 Python——dart 不在 PATH
      # 时脚本 fail-closed exit 2（「查不了」不判通过），门禁恒红。补装与
      # 其余工作流同版本的 Flutter（钉同一 SHA）。
      - name: 安装 Flutter（依赖过期检查需要 dart）
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: 'stable'
          cache: true
      - name: 依赖解析（pub outdated 前置）
        run: flutter pub get
      - name: 秘密扫描（Gitleaks 模式——0 误报）
        run: python tools/scan_secrets.py
      # 与 sbom.yml 的分工：sbom.yml 现在也监听 pull_request，但它**只归档制品**
      # （upload-artifact，供发布流水线取用）；本步骤是 PR 合并前的**门禁证据**，
      # 随本 job 的 check run 结论一起被 required status 引用。
      - name: SBOM 生成（CycloneDX）
        run: python tools/generate_sbom.py
      # C-004/C-005（专家更正期）：check_deps.sh 是 Bash 脚本——用 bash
      # 解释器；脚本仅输出依赖概览 + dart pub outdated（无真实 CVE 数据源/
      # 失败阈值）——步骤名诚实化为"依赖清单与过期检查"（不得声称 CVE 扫描）。
      - name: 依赖清单与过期检查
        run: bash tools/check_deps.sh
