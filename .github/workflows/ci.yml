name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI/CD 加固（Skylos SKY-D291——2026-08-16）：最小权限——不声明即拒绝。
permissions: {}


# 快速连推/重开 PR 时取消同组在跑的旧 run，节省排队时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-and-test:
    name: Analyze + Test + Metrics
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Skylos SKY-D293（2026-08-16）：checkout 不持久化凭据（无后续 git push）。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Enable Flutter Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # v1.17.20 CI flake 根治：真 KDF（Argon2id/PBKDF2）用例按 @Tags(['kdf'])
      # 拆出——主套件不再被 KDF 排队拖慢/击穿等待（dart_test.yaml 注册标签）。
      - name: Unit & widget tests (exclude real-KDF suite)
        run: flutter test --exclude-tags kdf

      - name: Real-KDF encryption suite (serial, dedicated)
        run: flutter test --tags kdf --concurrency=1

      - name: Install dart_code_metrics
        # E-02（审计 2026-09-27）供应链论证：精确版本钉死——pub.dev 已
        # 发布版本内容不可变，activate 5.7.6 每次解析同一内容，无 range
        # 漂移风险；残余风险仅「包被下架致激活失败」（届时再议去留）。
        # 5.7.6 要求 sdk <3.0.0，无法入 dev_dependencies 锁 pubspec.lock
        # （项目 sdk ^3.12.2）；迁闭源 dcm 需商业 license，移除门禁需
        # 用户同意——维持现状并在此备案（分析选项注释同步）。
        run: dart pub global activate dart_code_metrics 5.7.6

      - name: DCM quality gates
        # metrics 未加入 PATH 时通过完整路径调用（Windows）。
        run: |
          $dcm = "$env:LOCALAPPDATA\Pub\Cache\bin\metrics.bat"
          if (Test-Path $dcm) {
            & $dcm analyze lib --reporter=console --disable-sunset-warning
          } else {
            metrics analyze lib --reporter=console --disable-sunset-warning
          }
