name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI/CD 加固（Skylos SKY-D291——2026-08-16）：最小权限——不声明即拒绝。
permissions: {}


# 快速连推/重开 PR 时取消同组在跑的旧 run，节省排队时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-and-test:
    name: Analyze + Test + Metrics
    runs-on: windows-latest
    # 30 → 45（批次 AU，2026-10-05）：GitHub 托管 Windows runner 有速度方差，
    # 同一条 job 在 `c8de3ca` 用 15.3 分钟（unit 5.9 + real-KDF 6.8 + DCM 0.4），
    # 到 `13942ea` 同一批步骤跑了 25+ 分钟（unit 11.2 + real-KDF 13.8），
    # 于是**没改任何东西的 DCM 步骤被 30 分钟上限连带取消**（conclusion=cancelled，
    # 看着像门禁挂了，实为预算不足）。30 分钟只给了基线约 2 倍余量，容不下慢 runner 日。
    # 45 分钟仍是有界上限（quality_gate.yml 本来就是 60），不是无限放水。
    timeout-minutes: 45

    steps:
      # Skylos SKY-D293（2026-08-16）：checkout 不持久化凭据（无后续 git push）。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Enable Flutter Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # v1.17.20 CI flake 根治：真 KDF（Argon2id/PBKDF2）用例按 @Tags(['kdf'])
      # 拆出——主套件不再被 KDF 排队拖慢/击穿等待（dart_test.yaml 注册标签）。
      - name: Unit & widget tests (exclude real-KDF suite)
        run: flutter test --exclude-tags kdf

      - name: Real-KDF encryption suite (serial, dedicated)
        run: flutter test --tags kdf --concurrency=1

      - name: Install dart_code_metrics
        id: dcm_install
        # E-02（审计 2026-09-27 → 批次 AT 用户拍板「继续钉版 + 激活失败降级」）：
        # 精确版本钉死——pub.dev 已发布版本内容不可变，activate 5.7.6 每次解析同一内容，
        # 无 range 漂移风险；5.7.6 要求 sdk <3.0.0，无法入 dev_dependencies 锁 pubspec.lock
        # （项目 sdk ^3.12.2），迁闭源 dcm 需商业 license，移除门禁需用户同意——均不采。
        # 唯一残余风险是「上游已停维护并归档 ⇒ 包被下架 ⇒ 激活失败把整个 CI job 打死」，
        # 那是工具供应链故障、不是代码质量问题 ⇒ 降级为**可见告警**（warning 注解 +
        # Step Summary），不静默；DCM 门禁本身在可用时照常拦截违规。
        run: |
          dart pub global activate dart_code_metrics 5.7.6
          if ($LASTEXITCODE -eq 0) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            "::warning::E-02：dart_code_metrics 5.7.6 激活失败（上游下架或网络故障），本次运行的 DCM 质量门禁未执行——需人工处置，见本步注释。"
            "## E-02 告警：DCM 门禁被跳过（非代码问题）" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "激活 dart_code_metrics 5.7.6 失败，本次 DCM 质量门禁**未执行**。CI 故意不因此变红；" >> $env:GITHUB_STEP_SUMMARY
            "这是上游停维护带来的工具供应链告警，处置口径见 ci.yml 的 E-02 注释。" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: DCM quality gates
        if: steps.dcm_install.outputs.available == 'true'
        # metrics 未加入 PATH 时通过完整路径调用（Windows）。
        run: |
          $dcm = "$env:LOCALAPPDATA\Pub\Cache\bin\metrics.bat"
          if (Test-Path $dcm) {
            & $dcm analyze lib --reporter=console --disable-sunset-warning
          } else {
            metrics analyze lib --reporter=console --disable-sunset-warning
          }
