# P3 #49：CI Android 构建验证。
# 目标：确保 Android release 构建在 CI 中可复现，捕获编译/静态分析错误。
# Runner：ubuntu-latest + JDK 17（Temurin）——Flutter 3.47+ 要求 JDK 17。
name: Android Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  android-release:
    name: Analyze + Build APK (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # JDK 17（Temurin）——Flutter Android Gradle 插件要求。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      # 接受 Android SDK 许可证（CI 无交互）。
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: flutter pub get
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: Android Release Build
        run: flutter build apk --release
