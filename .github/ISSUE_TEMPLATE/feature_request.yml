name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述清楚动机与方案——这能帮助维护者评估价值。
  - type: textarea
    id: motivation
    attributes:
      label: 动机/背景
      description: 为什么需要这个功能？解决了什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案描述
      description: 你期望的功能行为（含交互细节——如有）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 考虑过的其他实现方式
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可选）
      options:
        - label: 本地功能（不涉及网络/账号）
        - label: 不影响现有加密/安全体系
        - label: 兼容现有数据格式（旧数据可读）
