# Gradle daemon 内存（2026-08-17）：默认 512m 导致 kernel_snapshot 编译
# daemon 崩溃（Android 集成测试 loading 失败）——逐步提至 4096m。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 增量编译禁用（2026-08-16）：跨盘符增量缓存损坏（C:\Pub\Cache vs
# D:\write——url_launcher_android——"different roots" 错误）——禁用防复发
# （全量编译——构建时间略增但稳定）。
kotlin.incremental=false
