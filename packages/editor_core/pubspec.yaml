name: editor_core
description: Pure Dart editor core for Drawing Notes V2 (immutable document, commands, geometry, history, serialization).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# 纯 Dart——禁止 Flutter/dart:io/file_selector/path_provider/shared_preferences（专家 R-02）。
dependencies:
  pointycastle: ^3.9.0  # 纯 Dart 加密库（AES-GCM/AES-KW/HKDF/SHA-256）。
  cryptography: ^2.5.0  # Ed25519 签名（纯 Dart——禁 Flutter/dart:io）。
  pqcrypto: ^0.4.1  # 后量子密码学（ML-KEM-768 + ML-DSA-65，纯 Dart）。

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
